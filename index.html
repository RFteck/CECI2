<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>♥</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Jost:wght@300;400&family=Caveat:wght@500&display=swap">
<style>
:root{--bg:#0e1230;--ink:#f3ebf0;--soft:#b9aec3;--rose:#e29bb0;--gold:#e6c79c;--line:rgba(230,199,156,.32);color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;color:var(--ink);font:300 17px/1.75 Jost,system-ui,sans-serif;background:linear-gradient(180deg,#0e1230 0,#171132 45%,#25112d 100%);overflow-x:hidden}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;margin:0;line-height:1.05}
p{margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.wrap{max-width:980px;margin:0 auto;padding:0 26px}
.sec{padding:96px 0}
.hd{display:flex;align-items:flex-end;gap:22px;margin-bottom:46px}
.hd h2{font-size:clamp(2.4rem,7vw,4.4rem)}
.hd::after{content:'';flex:1;height:1px;background:var(--line);margin-bottom:.9rem}
[data-k]{white-space:pre-wrap;overflow-wrap:anywhere}
body.editing [data-k]{outline:1px dashed var(--gold);outline-offset:5px;min-height:1.6em;min-width:3ch}
[data-k]:empty::before{content:'em branco ainda';opacity:.4;font:italic 300 .95rem/1.6 Jost,sans-serif;letter-spacing:0}
/* hero */
.hero{padding:90px 0 100px;background:radial-gradient(circle at 82% 18%,rgba(226,155,176,.22),transparent 55%)}
.hero .wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:48px;align-items:center}
.hero .in{animation:fade 1.6s ease both}
.name{font-size:clamp(3.6rem,12vw,8.6rem);letter-spacing:-.02em;line-height:.95;min-height:.95em}
#count{margin-top:30px;color:var(--gold);letter-spacing:.14em;font-size:.95rem}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* fotos */
.ph{aspect-ratio:3/4;border-radius:999px 999px 6px 6px;border:1px solid var(--gold);background:rgba(255,255,255,.04) center/cover no-repeat;display:grid;place-items:center;color:var(--gold);position:relative}
.ph.e::before{content:''}
.hp{position:relative;max-width:320px;width:100%;justify-self:center}
.hp::after{content:'';position:absolute;inset:12px -12px -12px 12px;border:1px solid var(--line);border-radius:999px 999px 6px 6px;z-index:-1}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:34px}
.gal .ph:nth-child(even){margin-top:34px}
/* história */
.tl{border-left:1px solid var(--line);margin-left:6px;padding-left:34px;display:grid;gap:46px}
.tl>div{position:relative}
.tl>div::before{content:'';position:absolute;left:-40px;top:.55rem;width:11px;height:11px;border-radius:50%;background:var(--rose)}
.tl h3{font-size:1.9rem;min-height:1em;margin-bottom:6px}
.tl p{color:var(--soft);max-width:54ch}
/* cartas */
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:60px 44px;align-items:start}
.folha{position:relative;padding:32px 26px 32px 76px;background:linear-gradient(90deg,transparent 58px,rgba(210,70,90,.55) 58px 60px,transparent 60px),repeating-linear-gradient(#fbfaf5 0 31px,#b9d0e6 31px 32px);color:#26233a;border-radius:3px;box-shadow:0 26px 40px -18px rgba(0,0,0,.7);transform:rotate(-1.2deg);font:500 1.5rem/32px Caveat,cursive}
.cx:nth-child(even) .folha{transform:rotate(1.2deg)}
.folha::before{content:'';position:absolute;left:14px;top:30px;bottom:30px;width:20px;background:radial-gradient(circle,#0e1230 0 7px,transparent 8px) 0 0/20px 64px repeat-y}
.folha h3{font:500 2.7rem/64px Caveat,cursive;min-height:64px;margin:0;text-align:center}
.cd{min-height:192px}.cs{text-align:right;min-height:32px}
body.editing .folha [data-k]{outline-color:#26233a}
.ph.pol{float:right;width:130px;aspect-ratio:4/5;margin:0 0 12px 16px;border:7px solid #fff;border-bottom-width:26px;border-radius:2px;box-shadow:0 6px 12px rgba(0,0,0,.35);transform:rotate(4deg);background-color:#efe6d8}
.ph.pol::after{content:'';position:absolute;top:-16px;left:50%;width:48px;height:18px;margin-left:-24px;background:rgba(226,155,176,.65);transform:rotate(-4deg)}
/* lista */
.lista{font:italic 500 clamp(1.5rem,3.6vw,2.3rem)/1.55 "Cormorant Garamond",Georgia,serif;max-width:26ch;min-height:2em}
/* abra quando */
.qa{border-top:1px solid var(--line);padding:20px 0}
.qa:last-child{border-bottom:1px solid var(--line)}
.qa .q{font:italic 500 1.7rem/1.2 "Cormorant Garamond",Georgia,serif;cursor:pointer;min-height:1.2em;padding-right:34px;position:relative}
body:not(.editing) .qa .q::after{content:'+';position:absolute;right:0;top:0;color:var(--gold);font:300 1.6rem Jost}
body:not(.editing) .qa.open .q::after{content:'–'}
.qa .a{display:none;padding-top:12px;color:var(--soft);max-width:58ch}
.qa.open .a,body.editing .qa .a{display:block}
/* carta */
.env{background:#f4ece3;color:#2a1c26;border-radius:4px;padding:38px 32px;max-width:680px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.eb{width:52px;height:52px;border-radius:50%;border:1px solid #2a1c26;background:none;color:#2a1c26;font-size:1.2rem;cursor:pointer}
.env .text{display:none;margin-top:26px;font:italic 500 1.4rem/1.6 "Cormorant Garamond",Georgia,serif;min-height:200px}
.env.open .text,body.editing .env .text{display:block}
.sig{margin-top:22px;font-size:1.6rem}
body.editing .env [data-k]{outline-color:#2a1c26}
/* pergunta */
.ask{min-height:70vh;display:grid;align-content:center;justify-items:center;text-align:center;gap:42px;position:relative}
.ask::before{content:'';position:absolute;inset:-20% -10%;background:radial-gradient(circle at 50% 50%,rgba(226,155,176,.35),transparent 60%);opacity:0;transition:opacity 2.4s;pointer-events:none}
body.sim .ask::before{opacity:1}
.qq{font-size:clamp(2.8rem,9vw,6rem);min-height:1.1em}
.yn{display:flex;gap:22px}
.yb{font:400 1rem Jost,sans-serif;letter-spacing:.06em;min-width:130px;padding:15px 30px;border:1px solid var(--gold);background:none;color:var(--ink);border-radius:999px;cursor:pointer;transition:background .3s,color .3s}
.yb:hover{background:var(--gold);color:#1a1030}
.ans{display:none;gap:14px;justify-items:center}
.ans.on,body.editing .ans{display:grid}
.ans p{display:none;font:italic 500 1.9rem/1.3 "Cormorant Garamond",Georgia,serif;max-width:30ch}
.ans.y .ay,.ans.n .an,body.editing .ans p{display:block}
#wa{display:none;color:var(--gold);font-size:.95rem;letter-spacing:.06em;margin-top:6px}
#wa.show{display:inline-block}
/* diario */
.capa{position:relative;width:100%;max-width:300px;aspect-ratio:3/4;background:linear-gradient(135deg,#3a1840,#1d1033);border:1px solid var(--gold);border-radius:6px 18px 18px 6px;box-shadow:0 26px 40px -18px rgba(0,0,0,.7),inset 10px 0 0 rgba(0,0,0,.25);display:grid;place-items:center;cursor:pointer;padding:30px}
.dtit{background:#f4ece3;color:#2a1c26;padding:22px 16px;text-align:center;font:500 1.9rem/1.15 Caveat,cursive;width:100%;min-height:90px;border-radius:2px;transform:rotate(-1deg);box-shadow:0 4px 8px rgba(0,0,0,.4)}
body.editing .dtit{outline-color:#2a1c26}
.band{position:absolute;right:22px;top:0;bottom:0;width:12px;background:rgba(226,155,176,.55)}
.book{max-width:560px}.book[hidden]{display:none}
.strip{position:relative;display:flex;gap:6px;overflow-x:auto;padding:4px 2px 18px}
.strip button{flex:none;min-width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--ink);font:400 .85rem Jost,sans-serif;cursor:pointer}
.strip button.on{background:var(--gold);color:#1a1030}
.pg{transform:rotate(-.6deg)}
.pg.turn{animation:turn .45s ease}
.dd{font:500 2.7rem/64px Caveat,cursive}.dd small{font-size:1.5rem;margin-left:12px;opacity:.7}
.dtx{min-height:288px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:24px;color:var(--soft)}
.nav button,.x{width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold);font-size:1.3rem;cursor:pointer}
.x{float:right;width:38px;height:38px;font-size:1rem;margin-bottom:8px}
@keyframes turn{from{opacity:0;transform:translateX(24px) rotate(1deg)}}
/* sem caixas vazias */
.ph.e,.hp:has(.ph.e){display:none}
.hero .wrap:has(.hp .ph.e){grid-template-columns:1fr}
/* chrome */
.dots{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:grid;gap:12px;z-index:6}
.dots a{width:7px;height:7px;border-radius:50%;border:1px solid var(--gold)}
.dots a:hover{background:var(--gold)}
.tool{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;gap:10px;align-items:center}
.tool input{display:none;font:inherit;color:var(--ink);background:#171132;border:1px solid var(--gold);border-radius:10px;padding:8px 10px;max-width:150px}
body.editing .tool input{display:block}
#tg{width:48px;height:48px;border-radius:50%;border:1px solid var(--gold);background:#171132;color:var(--gold);font-size:1.1rem;cursor:pointer}
@media (max-width:720px){.hero .wrap{grid-template-columns:1fr}.hp{max-width:230px;justify-self:start}.dots{display:none}.gal .ph:nth-child(even){margin-top:0}.sec{padding:70px 0}}
@media (prefers-reduced-motion:reduce){.hero .in{animation:none}html{scroll-behavior:auto}.ask::before{transition:none}.paper{animation:none}.en::before{transition:none}.pg.turn{animation:none}}
</style>
</head>
<body>
<main id="app"></main>
<div class="dots" id="dots"></div>
<script>
(function(){
var S={
/* ================= CONTEÚDO: escreva entre as aspas (pode usar várias linhas com crase `...`) ================= */
name:'',
/* Cartas (folhas de caderno): título, texto e assinatura */
hs1:'',
c0t:'', c0d:'', c0s:'',
c1t:'', c1d:'', c1s:'',
c2t:'', c2d:'', c2s:'',
c3t:'', c3d:'', c3s:'',
/* Lista (uma frase por linha) */
hs2:'', lista:'',
/* Galeria */
hs3:'',
/* Abra quando… (pergunta e resposta) */
hs4:'',
aq0:'', aa0:'', aq1:'', aa1:'', aq2:'', aa2:'', aq3:'', aa3:'', aq4:'', aa4:'',
/* Diário: título da capa e uma folha por dia, de 15/11 (dia0) até 01/12 (dia16) */
hs5:'', dtit:'Pra passar 31/12 com você',
dia0:'', dia1:'', dia2:'', dia3:'', 
dia4:'', dia5:'', dia6:'', dia7:'', 
dia8:'', dia9:'', dia10:'', dia11:'', 
dia12:'', dia13:'', dia14:'', dia15:'', 
dia16:'', 
/* Pergunta final e respostas */
q:'Volta comigo?', ay:'', an:'',
/* Data de início (AAAA-MM-DD) para o contador no topo, e WhatsApp com DDI+DDD (ex.: 5527999999999) */
date:'', tel:''
};
var D={};
var $=function(i){return document.getElementById(i)};
function e(t,k,c){return '<'+t+(c?' class="'+c+'"':'')+' data-k="'+k+'"></'+t+'>'}
function range(n,f){var o='';for(var i=0;i<n;i++)o+=f(i);return o}
function sec(id,inner){return '<section class="sec" id="'+id+'"><div class="wrap"><div class="hd">'+e('h2','h'+id)+'</div>'+inner+'</div></section>'}
function ph(i,c){return '<div class="ph e '+(c||'')+'" data-p="'+i+'" aria-hidden="true"></div>'}

var h='<header class="hero" id="s0"><div class="wrap"><div class="in">'+e('h1','name','name')+'<div id="count"></div></div><div class="hp">'+ph(6)+'</div></div></header>';
h+=sec('s1','<div class="cartas">'+range(4,function(i){return '<div class="cx"><div class="folha">'+e('h3','c'+i+'t')+ph(7+i,'pol')+e('div','c'+i+'d','cd')+e('div','c'+i+'s','cs')+'</div></div>'})+'</div>');
h+=sec('s2',e('div','lista','lista'));
h+=sec('s3','<div class="gal">'+range(6,ph)+'</div>');
h+=sec('s4','<div>'+range(5,function(i){return '<div class="qa">'+e('div','aq'+i,'q')+e('div','aa'+i,'a')+'</div>'})+'</div>');

h+=sec('s5','<div class="diario"><div class="capa" id="cv" role="button" tabindex="0" aria-expanded="false" aria-label="abrir diário">'+e('div','dtit','dtit')+'<i class="band"></i></div><div class="book" id="bk" hidden><button class="x" id="cls" aria-label="fechar">✕</button><div class="strip" id="strip"></div><div class="folha pg" id="pg"><div class="dd" id="dd"></div><div class="dtx" id="dtx" data-k="dia0"></div></div><div class="nav"><button id="prev" aria-label="anterior">‹</button><span id="cnt"></span><button id="next" aria-label="próxima">›</button></div></div></div>');
h+='<section class="sec" id="s6"><div class="wrap"><div class="ask">'+e('h2','q','qq')+'<div class="yn" id="yn"><button class="yb" data-a="y">Sim</button><button class="yb" data-a="n">Não</button></div><div class="ans" id="ans">'+e('p','ay','ay')+e('p','an','an')+'<a id="wa" target="_blank" rel="noopener">Enviar resposta</a></div></div></div></section>';
$('app').innerHTML=h;
$('dots').innerHTML=[0,1,2,3,4,5,6].map(function(i){return '<a href="#s'+i+'" aria-label="seção '+i+'"></a>'}).join('');

document.querySelectorAll('[data-k]').forEach(function(x){var k=x.dataset.k;x.textContent=S[k]!==undefined?S[k]:(D[k]||'')});

var editing=false;

document.addEventListener('click',function(ev){
var q=ev.target.closest('.qa .q');if(q&&!editing)q.parentNode.classList.toggle('open');var en=ev.target.closest('.en');if(en){var o=en.parentNode.classList.toggle('open');en.setAttribute('aria-expanded',o)}

var b=ev.target.closest('.yb');if(b&&!editing)answer(b.dataset.a)});

function answer(a){
$('yn').style.display='none';$('ans').className='ans on '+a;
if(a==='y')document.body.classList.add('sim');
var t=(S.tel||'').replace(/\D/g,'');
if(t){var q=S.q!==undefined?S.q:D.q;$('wa').href='https://wa.me/'+t+'?text='+encodeURIComponent(q+' '+(a==='y'?'Sim':'Não'));$('wa').classList.add('show')}}

var EX=['jpg','jpeg','png','webp'];
function loadPh(i){var el=document.querySelector('[data-p="'+i+'"]');if(!el)return;var num=i==6?1:(i<6?i+2:i+1),n=0;(function next(){if(n>=EX.length)return;var u='foto'+num+'.'+EX[n++],im=new Image();im.onload=function(){el.style.backgroundImage='url('+u+')';el.classList.remove('e')};im.onerror=next;im.src=u})()}
for(var i=0;i<11;i++)loadPh(i);



var DAYS=[],cp=0;
for(var d=0;d<17;d++){var dt=new Date(2026,10,15+d);DAYS.push({n:p2(dt.getDate())+'/'+p2(dt.getMonth()+1),w:dt.toLocaleDateString('pt-BR',{weekday:'long'}),b:dt.getDate()})}
$('strip').innerHTML=DAYS.map(function(x,i){return '<button data-d="'+i+'" aria-label="'+x.n+'">'+x.b+'</button>'}).join('');
function render(go){cp=Math.max(0,Math.min(DAYS.length-1,go));var x=DAYS[cp],t=$('dtx');$('dd').innerHTML='<b>'+x.n+'</b><small>'+x.w+'</small>';t.dataset.k='dia'+cp;t.textContent=S['dia'+cp]||'';var st=$('strip');document.querySelectorAll('#strip button').forEach(function(b,i){b.classList.toggle('on',i===cp)});var on=st.querySelector('.on');if(on)st.scrollLeft=on.offsetLeft-st.clientWidth/2+19;$('cnt').textContent=(cp+1)+' / '+DAYS.length;var pg=$('pg');pg.classList.remove('turn');void pg.offsetWidth;pg.classList.add('turn')}
$('cv').onclick=function(ev){if(editing&&ev.target.closest('[data-k]'))return;this.style.display='none';this.setAttribute('aria-expanded','true');$('bk').hidden=false;render(cp)};
$('cv').onkeydown=function(ev){if(ev.key==='Enter'&&!editing&&ev.target===this)this.click()};
$('cls').onclick=function(){$('bk').hidden=true;$('cv').style.display='';$('cv').setAttribute('aria-expanded','false')};
$('prev').onclick=function(){render(cp-1)};$('next').onclick=function(){render(cp+1)};
$('strip').onclick=function(ev){var b=ev.target.closest('button');if(b)render(+b.dataset.d)};
document.addEventListener('keydown',function(ev){if($('bk').hidden||editing)return;if(ev.key==='ArrowRight')render(cp+1);if(ev.key==='ArrowLeft')render(cp-1)});
function p2(n){return n<10?'0'+n:n}
function tick(){if(!S.date){$('count').textContent='';return}var ms=Date.now()-new Date(S.date+'T00:00:00').getTime();if(isNaN(ms)||ms<0)ms=0;$('count').textContent=Math.floor(ms/864e5)+' : '+p2(Math.floor(ms/36e5)%24)+' : '+p2(Math.floor(ms/6e4)%60)+' : '+p2(Math.floor(ms/1e3)%60)}
tick();setInterval(tick,1000);
})();
</script>
</body>
</html>
